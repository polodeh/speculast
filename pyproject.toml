[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "speculast"
version = "1.0.10"
description = "Semantic-first framework for Python architecture analysis, automated test generation, and infrastructure-aware reporting."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "speculast team" },
]
keywords = [
  "architecture-analysis",
  "ast",
  "automation",
  "docker",
  "pytest",
  "python",
  "reporting",
  "semantic-analysis",
  "testing",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "asyncpg>=0.29.0,<1.0.0",
  "jinja2>=3.1.4,<4.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pytest>=8.2.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "pytest-cov>=5.0.0,<7.0.0",
  "pytest-json-report>=1.5.0,<2.0.0",
  "rich>=13.7.0,<15.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0,<1.0.0",
  "testcontainers[postgresql,redis]>=4.8.0,<5.0.0",
]

[project.scripts]
speculast = "main:main"

[tool.hatch.build]
exclude = [
  "**/__pycache__",
  "**/*.pyc",
]

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.hatch.build.targets.wheel.force-include]
"main.py" = "main.py"

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "main.py",
  "engine",
  "tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
  "ignore:.*asyncio\\.get_event_loop_policy.*:DeprecationWarning:pytest_asyncio\\.plugin",
  "ignore:.*asyncio\\.set_event_loop_policy.*:DeprecationWarning:pytest_asyncio\\.plugin",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
